<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant | StudyVault</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="logo.png" alt="StudyVault Logo">
        <h2>StudyVault</h2>
    </div>
</header>

<section class="ai-section">

    <h1>🤖 AI Study Assistant</h1>

    <p>
        Ask any academic question and receive an explanation.
    </p>

    <div class="chat-box" id="chat-box">

        <div class="ai-message">
            👋 Hi! I'm your StudyVault AI Tutor. Ask me any study question.
        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="user-question"
            placeholder="Ask a question...">

        <button id="send-question">
            Send
        </button>

    </div>

</section>

<script src="js/ai.js"></script>

</body>
</html>
