<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Quizzes | StudyVault</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="logo.png" alt="StudyVault Logo">
        <h2>StudyVault</h2>
    </div>
</header>

<section class="quiz-section">

    <h1>Practice Quiz</h1>
    <p>Test your knowledge with a quick Mathematics quiz.</p>

    <div class="quiz-card">
        <h3>Question 1</h3>

        <p>What is 12 × 8?</p>

        <button onclick="checkAnswer(this, false)">84</button>
        <button onclick="checkAnswer(this, true)">96</button>
        <button onclick="checkAnswer(this, false)">108</button>
        <button onclick="checkAnswer(this, false)">88</button>

        <p id="result"></p>
    </div>

</section>

<script src="js/quiz.js"></script>

</body>
</html>
